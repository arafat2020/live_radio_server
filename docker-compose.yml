version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: radio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  icecast:
    image: moul/icecast
    ports:
      - "8000:8000"
    environment:
      ICECAST_SOURCE_PASSWORD: hackme
      ICECAST_ADMIN_PASSWORD: hackme
      ICECAST_PASSWORD: hackme
      ICECAST_RELAY_PASSWORD: hackme
    restart: unless-stopped

  liquidsoap:
    image: savonet/liquidsoap:v2.2.5
    volumes:
      - ./liquidsoap:/scripts
      - ./storage/playlists:/playlists
    command: liquidsoap /scripts/radio.liq
    depends_on:
      - icecast
    restart: unless-stopped

volumes:
  minio_data:
  postgres_data:
